[package]
name = "wasm-dashboard"
version = "0.1.0"
authors = ["oxide-byte <oxidebyte@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-nats = "0.50"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]
