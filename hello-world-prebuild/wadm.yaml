apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: hello-world-app
  annotations:
    version: v0.1.0
    description: "HTTP Hello World Demo"
spec:
  components:
    - name: http-component
      type: component
      properties:
        # Use localhost:4222/hello:0.1.0 if you chose Option A
        image: ghcr.io/wasmcloud/components/http-hello-world-rust:0.1.0
      traits:
        - type: spreadscaler
          properties:
            instances: 2 # Wadm will automatically balance these 2 instances across your 3 hosts!
    - name: httpserver
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.22.0
      traits:
        - type: link
          properties:
            target: http-component
            namespace: wrpc
            package: http
            interfaces: [incoming-handler]
            source:
              config:
                - name: default-http
                  properties:
                    address: 0.0.0.0:8080