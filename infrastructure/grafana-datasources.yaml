apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    basicAuth: false
    isDefault: true
    version: 1
    editable: false
    jsonData:
      httpMethod: GET
      streamingEnabled:
        search: true
  - name: Redis
    type: redis-datasource
    uid: redis
    access: proxy
    orgId: 1
    url: redis://redis:6379
    basicAuth: false
    version: 1
    editable: true
