services:
  nats:
    image: nats:2.11-alpine
    container_name: nats-connector
    ports:
      - "4222:4222" # NATS-Client-Port
      - "8222:8222" # NATS-Management-Port (HTTP-Monitoring)
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - wasmcloud-lattice

  # wasmCloud Server 1 (Host 1)
  wasmcloud-host-1:
    image: ghcr.io/wasmcloud/wasmcloud:latest
    container_name: wasmcloud-host-1
    environment:
      - WASMCLOUD_NATS_HOST=nats
      - WASMCLOUD_NATS_PORT=4222
      - WASMCLOUD_LATTICE=default
      - WASMCLOUD_HOST_ID=host-node-1
      - WASMCLOUD_JETSTREAM_DOMAIN=default
    depends_on:
      - nats
    networks:
      - wasmcloud-lattice

  # wasmCloud Server 2 (Host 2)
  wasmcloud-host-2:
    image: ghcr.io/wasmcloud/wasmcloud:latest
    container_name: wasmcloud-host-2
    environment:
      - WASMCLOUD_NATS_HOST=nats
      - WASMCLOUD_NATS_PORT=4222
      - WASMCLOUD_LATTICE=default
      - WASMCLOUD_HOST_ID=host-node-2
      - WASMCLOUD_JETSTREAM_DOMAIN=default
    depends_on:
      - nats
    networks:
      - wasmcloud-lattice

  # wasmCloud Server 3 (Host 3)
  wasmcloud-host-3:
    image: ghcr.io/wasmcloud/wasmcloud:latest
    container_name: wasmcloud-host-3
    environment:
      - WASMCLOUD_NATS_HOST=nats
      - WASMCLOUD_NATS_PORT=4222
      - WASMCLOUD_LATTICE=default
      - WASMCLOUD_HOST_ID=host-node-3
      - WASMCLOUD_JETSTREAM_DOMAIN=default
    depends_on:
      - nats
    networks:
      - wasmcloud-lattice

networks:
  wasmcloud-lattice:
    driver: bridge

volumes:
  nats_data: