apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: http-kv-handler
  annotations:
    version: v0.1.0
    description: "HTTP + Key-Value Handler Component"
spec:
  components:
    - name: http-kv-handler
      type: component
      properties:
        # Push your WASM to a local registry with:
        # wash oci push --insecure localhost:5001/http-kv-handler:0.1.0 ./target/wasm32-wasip2/release/http_kv_handler.wasm
        # Then use: registry:5000/http-kv-handler:0.1.0 (in-lattice address)
        image: registry:5000/http-kv-handler:0.1.0
      traits:
        - type: spreadscaler
          properties:
            instances: 1
    - name: httpserver
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.22.0
      traits:
        - type: link
          properties:
            target: http-kv-handler
            namespace: wrpc
            package: http
            interfaces: [incoming-handler]
            source:
              config:
                - name: default-http
                  properties:
                    address: 0.0.0.0:8080
    - name: keyvalue
      type: capability
      properties:
        image: ghcr.io/wasmcloud/keyvalue-redis:0.25.0
      traits:
        - type: link
          properties:
            target: http-kv-handler
            namespace: wasi
            package: keyvalue
            interfaces: [store]
            source:
              config:
                - name: redis-connection
                  properties:
                    url: redis://redis:6379
